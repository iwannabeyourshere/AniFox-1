name: Desktop validation

# Validation run for the fix/desktop-release-builds branch.

on:
  workflow_dispatch:
  push:
    branches:
      - AniFox

jobs:
  desktop:
    name: Build ${{ matrix.platform }} desktop package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: windows
          - platform: linux-x64
            runner: ubuntu-24.04
            target: linux
          - platform: macos
            runner: macos-15
            target: macos
    env:
      APP_VERSION: 1.0.0
      BUILD_NUMBER: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/desktop-release-builds

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config unzip libgtk-3-dev \
            libsecret-1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libasound2-dev libepoxy-dev libva-dev flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Flutter dependencies
        run: npm run flutter -- pub get

      - name: Build desktop app
        shell: bash
        run: >-
          npm run flutter -- build "${{ matrix.target }}" --release --no-pub
          --build-name="$APP_VERSION" --build-number="$BUILD_NUMBER"

      - name: Package Windows build
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/anifox-windows-x64.zip" -CompressionLevel Optimal

      - name: Package Linux build
        if: matrix.target == 'linux'
        run: |
          mkdir -p build/flatpak
          flatpak-builder \
            --user \
            --disable-rofiles-fuse \
            --force-clean \
            --install-deps-from=flathub \
            --repo=build/flatpak/repo \
            build/flatpak/build \
            flatpak.json

          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            build/flatpak/repo \
            build/anifox-linux-x64.flatpak \
            dev.itzfallenme.anifox \
            stable

          flatpak install --user --noninteractive --assumeyes \
            build/anifox-linux-x64.flatpak
          flatpak info --user dev.itzfallenme.anifox
          flatpak run --user --command=sh dev.itzfallenme.anifox \
            -c 'test -x /app/bin/anifox && test -x /app/libexec/anifox/anifox && test -d /app/libexec/anifox/data && test -d /app/libexec/anifox/lib'

      - name: Package macOS build
        if: matrix.target == 'macos'
        run: |
          app="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" build/anifox-macos.zip

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: build/anifox-*
          if-no-files-found: error

  ios:
    name: Build unsigned iOS app
    runs-on: macos-26
    env:
      APP_VERSION: 1.0.0
      BUILD_NUMBER: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/desktop-release-builds

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter dependencies
        run: npm run flutter -- pub get

      - name: Build unsigned iOS app
        run: >-
          npm run flutter -- build ios --release --no-codesign --no-pub
          --build-name="$APP_VERSION" --build-number="$BUILD_NUMBER"
